name: ANTIQUA Browser E2E
on:
  push:
    branches: [main]
  pull_request:
    branches: [main, hardening/v015-provider-webhook-security, hardening/db-identity-gate-v55, feature/decision-dossier-http-v86, feature/collector-evidence-readiness-v87]
concurrency:
  group: antiqua-browser-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  chromium-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    env:
      PREVIEW_MODE: "true"
      NODE_ENV: test
      BROWSER_E2E_PORT: "12026"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Install pinned Playwright runner
        # This ephemeral dev manifest/lock exists only in the CI checkout.
        # Unlike --no-save, it lets npm audit inspect the actual browser runner.
        run: npm install --save-dev --save-exact --ignore-scripts @playwright/test@1.63.0
      - name: Verify and audit the complete browser toolchain
        run: |
          mkdir -p artifacts/browser-toolchain
          node -e "for (const name of ['@playwright/test','playwright','playwright-core']) { const version = require(name + '/package.json').version; if (version !== '1.63.0') throw new Error(name + ': unexpected version ' + version); }"
          npm ls @playwright/test playwright playwright-core --json > artifacts/browser-toolchain/versions.json
          cp package-lock.json artifacts/browser-toolchain/ephemeral-package-lock.json
          npm audit --include=dev --audit-level=high --json > artifacts/browser-toolchain/audit.json
      - name: Install Chromium
        run: ./node_modules/.bin/playwright install --with-deps chromium
      - name: Syntax check every browser spec
        run: |
          for spec in tests/browser/*.spec.mjs; do
            node --check "$spec"
          done
      - name: Run real browser journeys
        run: ./node_modules/.bin/playwright test -c playwright.config.mjs
      - name: Upload browser toolchain audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: antiqua-browser-toolchain-${{ github.sha }}
          path: artifacts/browser-toolchain/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload visual proof and failure traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: antiqua-visual-proof-${{ github.sha }}
          path: |
            artifacts/visual-proof/*.png
            test-results/
          if-no-files-found: warn
          retention-days: 14

name: ANTIQUA Public Provenance Redaction
on:
  pull_request:
    branches: [main]
    paths:
      - provenance-evidence-passport-v43.mjs
      - tests/public-provenance-redaction-v57.mjs
      - .github/workflows/public-provenance-redaction-v57.yml
jobs:
  public-privacy:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Validate read-model and public privacy
        run: |
          node --check provenance-evidence-passport-v43.mjs
          node tests/provenance-passport-v43.mjs
          node tests/artwork-dossier-v51.mjs
          node tests/public-provenance-redaction-v57.mjs

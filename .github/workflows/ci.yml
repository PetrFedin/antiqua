name: ANTIQUA CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm audit --omit=dev --audit-level=high
      - run: npm test

  postgres-durability:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: antiqua
          POSTGRES_PASSWORD: antiqua
          POSTGRES_DB: antiqua_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U antiqua -d antiqua_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12
    env:
      DATABASE_URL: postgresql://antiqua:antiqua@127.0.0.1:5432/antiqua_test
      PGSSL: disable
      PREVIEW_MODE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run migrate
      - run: npm run test:postgres
